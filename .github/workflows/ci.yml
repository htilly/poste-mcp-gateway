name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Actions are pinned to commit SHAs (Dependabot keeps them current): the image
# job holds packages: write, and its output handles users' mail passwords.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Live IMAP tests against Dovecot, the server poste.io runs. Covers the
  # read path end to end and that EXAMINE makes the server refuse writes.
  live-imap:
    runs-on: ubuntu-latest
    services:
      dovecot:
        image: dovecot/dovecot:2.4.1@sha256:1296e0f1029cdd95e6849fb82f5d142a6e2a46218451773316cea678de75254b
        env:
          USER_PASSWORD: dovecot-test
        ports:
          - 4993:31993
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wait for Dovecot
        run: for i in $(seq 1 30); do nc -z localhost 4993 && exit 0; sleep 1; done; exit 1
      - run: npx vitest run test/live.test.ts
        env:
          LIVE_IMAP: "1"
          LIVE_IMAP_SERVER: dovecot
          LIVE_IMAP_PORT: "4993"
          LIVE_IMAP_PASSWORD: dovecot-test

  image:
    needs: [test, live-imap]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Each image stands alone; one failing push must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: .
            image: ghcr.io/${{ github.repository }}
          - name: caddy
            context: deploy/caddy
            image: ghcr.io/${{ github.repository }}-caddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
